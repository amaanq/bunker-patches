# overlaps repkgs linux's common group, dedupe once NixOS hosts boot repkgs kernels and module.nix goes
BUNKER                  = "y"
LOCALVERSION            = "-bunker"
MODULE_DECOMPRESS       = "y"        # in-kernel module decompression
FW_LOADER_COMPRESS_ZSTD = "y"        # zstd firmware compression
BPF_SYSCALL             = "y"
BPF_JIT                 = "y"
PSI                     = "y"        # Pressure Stall Information (systemd-oomd)
ANON_VMA_NAME           = "y"        # prctl names for anonymous mappings in /proc/pid/maps
MODULE_COMPRESS_ZSTD    = "y"
MODULE_COMPRESS_XZ      = "n"

["<7.4"]
# 7.4 renamed it COREBOOT_FIRMWARE and left the old name transitional
GOOGLE_FIRMWARE = "y"

# 7.4 made KVM MMIO unconditional and deleted the symbol
KVM_MMIO = "y"

["<7.2"]
# nixpkgs forces all three but 7.2 removed or de-prompted them
CRYPTO_DRBG_HASH      = "y"
CRYPTO_DRBG_CTR       = "y"
RANDOM_KMALLOC_CACHES = "y"

[">=7.4"]
COREBOOT_FIRMWARE = "y"

[x86_64]
MICROCODE = "y"

[x86_64.next]
BPF_JIT_ALWAYS_ON = "y"

[aarch64]
ARM64_64K_PAGES = "y"  # 64K pages — 10-15% compilation speedup from TLB coverage
ARM64_4K_PAGES  = "n"

[aarch64.next]
BPF_JIT_ALWAYS_ON = "y"

[powerpc64]
PPC_64K_PAGES = "y"  # 64K pages — native PPC64 page size
PPC_4K_PAGES  = "n"

[riscv64]
SOPHGO_SG2042_MSI = "y"  # SG2042 PCIe MSI controller, no Kconfig default
