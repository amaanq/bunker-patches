# overlaps repkgs linux's desktop and common groups, dedupe once NixOS hosts boot repkgs kernels and module.nix goes
HZ                           = "1000"
HZ_1000                      = "y"
MQ_IOSCHED_ADIOS             = "y"
FUTEX                        = "y"
FUTEX_PI                     = "y"
NTSYNC                       = "y"
TREE_RCU                     = "y"
PREEMPT_RCU                  = "y"
RCU_EXPERT                   = "y"
TREE_SRCU                    = "y"
TASKS_RCU_GENERIC            = "y"
TASKS_RCU                    = "y"
TASKS_RUDE_RCU               = "y"
TASKS_TRACE_RCU              = "y"
RCU_STALL_COMMON             = "y"
RCU_NEED_SEGCBLIST           = "y"
RCU_FANOUT                   = "64"
RCU_FANOUT_LEAF              = "16"
RCU_BOOST                    = "y"
RCU_BOOST_DELAY              = "500"
RCU_NOCB_CPU                 = "y"
RCU_LAZY                     = "y"
RCU_DOUBLE_CHECK_CB_TIME     = "y"
LRU_GEN                      = "y" # Multi-gen LRU — better memory reclaim under pressure
LRU_GEN_ENABLED              = "y"
PREEMPT                      = "y"
PREEMPT_LAZY                 = "n"
PREEMPT_VOLUNTARY            = "n" # removed on archs with ARCH_HAS_PREEMPT_LAZY in 7.0+
IOSCHED_BFQ                  = "y"
TRANSPARENT_HUGEPAGE         = "y"
TRANSPARENT_HUGEPAGE_ALWAYS  = "n"
TRANSPARENT_HUGEPAGE_MADVISE = "y"
MQ_IOSCHED_KYBER             = "y"
BLK_WBT                      = "n"
BLK_WBT_MQ                   = "n"

[x86_64]
X86_AMD_PSTATE              = "y"
X86_AMD_PSTATE_DEFAULT_MODE = "3"
X86_FRED                    = "y" # Flexible Return and Event Delivery (Zen 5+ / Arrow Lake+)
PERF_EVENTS_AMD_POWER       = "y" # AMD power events for perf profiling
