# overlaps repkgs linux's common group, dedupe once NixOS hosts boot repkgs kernels and module.nix goes
NET_SCH_DEFAULT  = "y"
DEFAULT_FQ       = "n"
DEFAULT_FQ_CODEL = "y"
NET_SCH_FQ       = "m"

["<7.1"]
TCP_CONG_BBR = "y"
DEFAULT_BBR  = "y"

# 7.0's patch set has BBRv3 too, but bunker picks it only from 7.1
["7.0"]
TCP_CONG_BBR3 = "m"
DEFAULT_BBR3  = "n"

[">=7.1"]
TCP_CONG_BBR  = "m"
TCP_CONG_BBR3 = "y"
DEFAULT_BBR   = "n"
DEFAULT_BBR3  = "y"
